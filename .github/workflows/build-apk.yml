name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract application
        run: |
          unzip PrimeWay_Lollybird_Petty_Cash_Android_V8.zip -d source

      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Keep test APK signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: primeway-android-debug-signing-v6

      - name: Build APK
        working-directory: source/PrimeWay_Petty_Cash_Android
        run: gradle --no-daemon assembleDebug

      - name: Save downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimeWay-Android-APK
          path: source/PrimeWay_Petty_Cash_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
