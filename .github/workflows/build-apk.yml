name: Build PrimeWay Android V11 New Installation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download repository
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Extract application
        run: unzip PrimeWay_Android_V11_New_Installation_Source.zip -d source
      - name: Check ledger, transfer and V11 regression tests
        working-directory: source/PrimeWay_Petty_Cash_Android
        run: |
          for test in test-*.cjs; do node "$test" || exit 1; done
      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore permanent V11 installation signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PRIMEWAY_V11_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing PRIMEWAY_V11_KEYSTORE_BASE64. Follow the key setup guide first."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
      - name: Test and build APK
        working-directory: source/PrimeWay_Petty_Cash_Android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimeWay-Android-V11-New-Installation
          path: source/PrimeWay_Petty_Cash_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Remove signing key from runner
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
